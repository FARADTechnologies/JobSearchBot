name: JobSearchBot

on:
  schedule:
    # Times are UTC. Azerbaijan is UTC+4, so these run at
    # 09:00, 12:00, 15:00, 18:00 and 21:00 Baku time.
    - cron: "0 5,8,11,14,17 * * *"
  workflow_dispatch: {}

# Allow the workflow to commit the updated "seen jobs" memory back to the repo.
permissions:
  contents: write

concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUTF8: "1"
        run: python -m jobbot

      - name: Persist seen jobs
        run: |
          if [ -n "$(git status --porcelain data/seen_jobs.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen_jobs.json
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          else
            echo "No new seen jobs to persist."
          fi
